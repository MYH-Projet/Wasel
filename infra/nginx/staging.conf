worker_processes auto;

events {
    worker_connections 1024;
}

http {
    # ──────────────────────────────────────────────
    # Upstream definitions
    # ──────────────────────────────────────────────
    upstream wasel_api {
        server wasel-api-staging:8080;
    }

    upstream wasel_keycloak {
        server wasel-keycloak-staging:8080;
    }

    upstream wasel_frontend {
        # The frontend container is serving the built Astro app
        server wasel-frontend-staging:4321; 
    }

    server {
        listen 80;
        # STAGING_DOMAIN could be replaced during deployment, but keeping it general
        server_name localhost _; 

        # Security Headers
        add_header X-Frame-Options "SAMEORIGIN";
        add_header X-XSS-Protection "1; mode=block";
        add_header X-Content-Type-Options "nosniff";

        # ──────────────────────────────────────────
        # /api/* → Backend .NET API
        # ──────────────────────────────────────────
        location /api/ {
            proxy_pass http://wasel_api/api/;

            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-Host  $host;
            proxy_set_header X-Forwarded-Port  $server_port;
        }

        # ──────────────────────────────────────────
        # /auth/* → Keycloak
        # ──────────────────────────────────────────
        location /auth/ {
            proxy_pass http://wasel-keycloak-staging:8080/auth/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-Port $server_port;
        }

        # ──────────────────────────────────────────
        # / → Frontend Astro
        # ──────────────────────────────────────────
        location / {
            proxy_pass http://wasel_frontend;
            
            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }
}
