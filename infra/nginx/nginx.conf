worker_processes auto;

events {
    worker_connections 1024;
}

http {
    # ──────────────────────────────────────────────
    # Upstream definitions
    # ──────────────────────────────────────────────
    upstream wasel_api {
        server wasel-api:8080;
    }

    upstream wasel_keycloak {
        server wasel-keycloak:8080;
    }

    upstream wasel_frontend {
        server wasel-frontend:4321; 
    }

    server {
        listen 80;
        server_name localhost;

        # ──────────────────────────────────────────
        # /api/* → Backend .NET API
        # ──────────────────────────────────────────
        location /api/ {
            proxy_pass http://wasel_api/api/;

            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-Host  $host;
            proxy_set_header X-Forwarded-Port  $server_port;
        }

        # ──────────────────────────────────────────
        # /auth/* → Keycloak (KC_HTTP_RELATIVE_PATH=/auth)
        # ──────────────────────────────────────────
        location /auth/ {
            proxy_pass http://wasel_keycloak/auth/;

            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-Host  $host;
            proxy_set_header X-Forwarded-Port  $server_port;

            # Keycloak needs larger buffers for token exchange
            proxy_buffer_size          128k;
            proxy_buffers              4 256k;
            proxy_busy_buffers_size    256k;
        }

        # ──────────────────────────────────────────
        # Scalar API docs via Nginx
        # ──────────────────────────────────────────
        location /scalar/ {
            proxy_pass http://wasel_api/scalar/;

            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location /openapi/ {
            proxy_pass http://wasel_api/openapi/;

            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # ──────────────────────────────────────────
        location / {
            proxy_pass http://wasel_frontend;
            
            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
        }
    }
}
