# ──────────────────────────────────────────────
# Backend CI — Restore, Build, Test, Validate
# ──────────────────────────────────────────────
# Ce workflow vérifie que le backend compile et que
# la configuration Docker Compose est valide.
# Il ne construit/pousse aucune image Docker.
# Il ne déploie rien.

name: Backend CI

on:
  pull_request:
    branches:
      - dev
      - main
    paths:
      - "backend/**"
      - "docker-compose.yml"
      - ".github/workflows/backend-ci.yml"

  push:
    branches:
      - dev
    paths:
      - "backend/**"
      - "docker-compose.yml"
      - ".github/workflows/backend-ci.yml"

jobs:
  backend-ci:
    name: Backend CI
    runs-on: ubuntu-latest

    steps:
      # ── 1. Checkout ──
      - name: Checkout repository
        uses: actions/checkout@v4

      # ── 2. Setup .NET 10 ──
      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      # ── 3. Restore ──
      - name: Restore dependencies
        run: dotnet restore backend/Wasel.Api/Wasel.Api.csproj

      # ── 4. Build ──
      - name: Build backend
        run: dotnet build backend/Wasel.Api/Wasel.Api.csproj --no-restore --configuration Release

      # ── 5. Tests ──
      - name: Run tests (if any)
        run: |
          TEST_PROJECTS=$(find backend -name "*Tests.csproj" -type f)
          if [ -z "$TEST_PROJECTS" ]; then
            echo "ℹ️  No test project found in backend/. Skipping tests."
          else
            echo "✅ Found test project(s):"
            echo "$TEST_PROJECTS"
            for project in $TEST_PROJECTS; do
              echo "──────────────────────────────────────"
              echo "Running tests for: $project"
              dotnet test "$project" --configuration Release --no-build --verbosity normal
            done
          fi

      # ── 6. Validate Docker Compose ──
      - name: Validate docker compose config
        run: docker compose config --quiet
