name: Wasel CI/CD

on:
  push:
    branches: ["dev", "main"]
  pull_request:
    branches: ["dev"]

env:
  REGISTRY: docker.io
  IMAGE_BACKEND: mba1342004/wasel-backend
  IMAGE_FRONTEND: mba1342004/wasel-frontend

jobs:
  # 🧪 JOB 1 : EXECUTION DES TESTS
  tests:
    runs-on: ubuntu-latest

    steps:
      - name: Récupération du code
        uses: actions/checkout@v4

      # -- Tests Backend (.NET) --
      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Installation des dépendances Backend
        run: dotnet restore Wasel.sln

      - name: Build solution (Release)
        run: dotnet build Wasel.sln --no-restore --configuration Release

      - name: Lancement des Tests Backend
        run: dotnet test backend/Wasel.Api.Tests/Wasel.Api.Tests.csproj --configuration Release --no-build --verbosity normal

      # -- Tests Frontend Web (Node) --
      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: web/package-lock.json

      - name: Installation des dépendances Frontend
        working-directory: ./web
        run: npm ci

      - name: Lancement des Tests Web
        working-directory: ./web
        run: |
          npm run build
          npm test

      # -- Tests Mobile (Flutter) --
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Installation des dépendances Mobile
        working-directory: ./mobile
        run: flutter pub get

      - name: Analyse du code Mobile
        working-directory: ./mobile
        run: flutter analyze

      - name: Lancement des Tests Mobile
        working-directory: ./mobile
        run: flutter test

  # -----------------------------------
  # CI: build + push images to DockerHub
  # only on push to dev or main (not PR)
  # -----------------------------------
  build-and-push:
    runs-on: ubuntu-latest
    needs: tests
    if: github.event_name == 'push' && (github.ref == 'refs/heads/dev' || github.ref == 'refs/heads/main')

    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build & push backend
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: true
          tags: |
            ${{ env.IMAGE_BACKEND }}:latest
            ${{ env.IMAGE_BACKEND }}:dev

      - name: Build & push frontend
        uses: docker/build-push-action@v6
        with:
          context: ./web
          file: ./web/Dockerfile
          push: true
          build-args: |
            VITE_API_URL=/api
            NODE_ENV=production
          tags: |
            ${{ env.IMAGE_FRONTEND }}:latest
            ${{ env.IMAGE_FRONTEND }}:dev

  # ----------------------------
  # CD: deploy on EC2
  # only when main changes (merge dev -> main)
  # ----------------------------
  deploy-prod:
    runs-on: ubuntu-latest
    needs: [tests, build-and-push]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    steps:
      - name: Configure SSH agent
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.EC2_SSH_PRIVATE_KEY }}

      - name: Add EC2 host key
        run: |
          mkdir -p ~/.ssh
          ssh-keyscan -H "${{ secrets.EC2_HOST }}" >> ~/.ssh/known_hosts

      - name: Deploy via docker compose (pull latest)
        run: |
          ssh ubuntu@${{ secrets.EC2_HOST }} << 'EOF'
            set -e
            cd ~/wasel

            docker compose -f docker-compose.prod.yml pull
            docker compose -f docker-compose.prod.yml up -d

            docker image prune -f
          EOF
