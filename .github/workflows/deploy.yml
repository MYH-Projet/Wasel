name: Deploy to Staging VPS

on:
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Configure SSH agent
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.STAGING_SSH_KEY }}

      - name: Add VPS host key
        run: |
          mkdir -p ~/.ssh
          ssh-keyscan -H "${{ secrets.STAGING_HOST }}" >> ~/.ssh/known_hosts

      - name: Deploy via Docker Compose on VPS
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: |
          ssh ${{ secrets.STAGING_USER }}@${{ secrets.STAGING_HOST }} << EOF
            set -e
            cd /opt/wasel-staging

            # Login to Docker Hub
            echo "$DOCKERHUB_TOKEN" | docker login -u "$DOCKERHUB_USERNAME" --password-stdin

            # Pull latest images
            docker compose -f docker-compose.staging.yml --env-file .env.staging pull

            # Start services
            docker compose -f docker-compose.staging.yml --env-file .env.staging up -d

            # Clean up old images
            docker image prune -f

            # Healthcheck
            echo "Waiting for services to be up..."
            sleep 15
            curl -f http://localhost/api/health || { echo "Healthcheck failed!"; exit 1; }
            echo "Deployment successful."
          EOF
