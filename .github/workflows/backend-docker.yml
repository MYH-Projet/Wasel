# ──────────────────────────────────────────────
# Backend Docker Build and Push
# ──────────────────────────────────────────────
# Ce workflow construit l'image Docker du backend
# et la pousse vers Docker Hub après un merge dans main.
# Il ne déploie rien sur un serveur.
#
# ⚠️  IMPORTANT : Remplacez CHANGE_ME_DOCKERHUB_USERNAME
#    par votre vrai username Docker Hub dans la variable
#    IMAGE_NAME ci-dessous.
#
# Secrets GitHub requis (à configurer dans le repo) :
#   - DOCKERHUB_USERNAME : votre username Docker Hub
#   - DOCKERHUB_TOKEN    : un Personal Access Token Docker Hub

name: Backend Docker Build and Push

on:
  push:
    branches:
      - main
    paths:
      - "backend/**"
      - "docker-compose.yml"
      - ".github/workflows/backend-docker.yml"


env:
  REGISTRY: docker.io
  IMAGE_NAME: myelhadri/wasel-api

jobs:
  build-and-push-backend:
    name: Build and Push Backend Image
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    steps:
      # ── 1. Checkout ──
      - name: Checkout repository
        uses: actions/checkout@v4

      # ── 2. Setup Docker Buildx ──
      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      # ── 3. Login to Docker Hub ──
      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # ── 4. Extract Docker metadata ──
      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=sha,prefix=sha-,format=short
            type=raw,value=latest

      # ── 5. Build and push Docker image ──
      - name: Build and push backend image
        uses: docker/build-push-action@v5
        with:
          context: ./backend/Wasel.Api
          file: ./backend/Wasel.Api/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
