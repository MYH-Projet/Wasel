name: Build and Push Custom Keycloak Image

on:
  push:
    branches:
      - main
    paths:
      - 'infra/keycloak/**'
      - '.github/workflows/keycloak-docker.yml'

jobs:
  build-and-push-keycloak:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and Push Docker image
        uses: docker/build-push-action@v5
        with:
          context: ./infra/keycloak
          file: ./infra/keycloak/Dockerfile
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/wasel-keycloak:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/wasel-keycloak:${{ github.sha }}
