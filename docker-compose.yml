# ══════════════════════════════════════════════════
# Wasel — Docker Compose (Development)
# ══════════════════════════════════════════════════

services:
  # ──────────────────────────────────────────────
  # Wasel API (.NET 10)
  # ──────────────────────────────────────────────
  wasel-api:
    build:
      context: ./backend/Wasel.Api
      dockerfile: Dockerfile
    container_name: wasel-api
    ports:
      - "5000:8080"
    environment:
      - ASPNETCORE_ENVIRONMENT=${ASPNETCORE_ENVIRONMENT:-Development}
      - ConnectionStrings__DefaultConnection=Host=wasel-postgres;Port=5432;Database=${POSTGRES_DB};Username=${POSTGRES_USER};Password=${POSTGRES_PASSWORD}
      - Redis__ConnectionString=${REDIS_CONNECTION_STRING}
      - MinIO__InternalEndpoint=wasel-minio:9000
      - MinIO__PublicEndpoint=localhost:9000
      - MinIO__AccessKey=${MINIO_ROOT_USER}
      - MinIO__SecretKey=${MINIO_ROOT_PASSWORD}
      - MinIO__BucketName=wasel-files
      - MinIO__UseSSL=false
      - Keycloak__Authority=http://localhost:8080/auth/realms/${KEYCLOAK_REALM}
      - Keycloak__InternalAuthority=http://wasel-keycloak:8080/auth/realms/${KEYCLOAK_REALM}
      - Keycloak__NginxAuthority=http://localhost:8000/auth/realms/${KEYCLOAK_REALM}
      - Keycloak__Realm=${KEYCLOAK_REALM}
      - Keycloak__ClientId=${KEYCLOAK_CLIENT_ID}
      - Keycloak__RequireHttpsMetadata=false
      - RabbitMQ__Host=wasel-rabbitmq
      - RabbitMQ__Port=5672
      - RabbitMQ__Username=wasel
      - RabbitMQ__Password=wasel
      - RabbitMQ__ExchangeName=wasel.events
      - RabbitMQ__NotificationRoutingKey=notification.requested
    depends_on:
      wasel-postgres:
        condition: service_healthy
      wasel-redis:
        condition: service_healthy
      wasel-minio:
        condition: service_healthy
      wasel-keycloak:
        condition: service_healthy
      wasel-rabbitmq:
        condition: service_healthy
    networks:
      - wasel-network
    restart: unless-stopped

  # ──────────────────────────────────────────────
  # Wasel Notification Service (.NET 10 Worker)
  # ──────────────────────────────────────────────
  wasel-notification-service:
    build:
      context: .
      dockerfile: services/Wasel.NotificationService/Dockerfile
    container_name: wasel-notification-service
    environment:
      - ConnectionStrings__DefaultConnection=Host=wasel-postgres;Port=5432;Database=${POSTGRES_DB};Username=${POSTGRES_USER};Password=${POSTGRES_PASSWORD}
      - RabbitMQ__Host=wasel-rabbitmq
      - RabbitMQ__Port=5672
      - RabbitMQ__Username=${RABBITMQ_DEFAULT_USER:-wasel}
      - RabbitMQ__Password=${RABBITMQ_DEFAULT_PASS:-wasel}
      - RabbitMQ__ExchangeName=wasel.events
      - RabbitMQ__QueueName=notification.requested
      - RabbitMQ__RoutingKey=notification.requested
      - Firebase__Enabled=${FIREBASE_ENABLED:-false}
      - Firebase__ProjectId=${FIREBASE_PROJECT_ID}
      - Firebase__CredentialsPath=${FIREBASE_CREDENTIALS_PATH}
    depends_on:
      wasel-postgres:
        condition: service_healthy
      wasel-rabbitmq:
        condition: service_healthy
    networks:
      - wasel-network
    restart: unless-stopped

  # ──────────────────────────────────────────────
  # PostgreSQL 18.3
  # ──────────────────────────────────────────────
  wasel-postgres:
    image: postgres:18.3
    container_name: wasel-postgres
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - wasel-postgres-data:/var/lib/postgresql:z
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}" ]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - wasel-network
    restart: unless-stopped

  # ──────────────────────────────────────────────
  # RabbitMQ
  # ──────────────────────────────────────────────
  wasel-rabbitmq:
    image: rabbitmq:3-management
    container_name: wasel-rabbitmq
    ports:
      - "5672:5672"
      - "15672:15672"
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_DEFAULT_USER:-wasel}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_DEFAULT_PASS:-wasel}
    volumes:
      - wasel-rabbitmq-data:/var/lib/rabbitmq
    healthcheck:
      test: [ "CMD", "rabbitmq-diagnostics", "-q", "ping" ]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - wasel-network
    restart: unless-stopped

  # ──────────────────────────────────────────────
  # Redis 8.6
  # ──────────────────────────────────────────────
  wasel-redis:
    image: redis:8.6
    container_name: wasel-redis
    ports:
      - "6379:6379"
    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - wasel-network
    restart: unless-stopped

  # ──────────────────────────────────────────────
  # MinIO (Object Storage)
  # ──────────────────────────────────────────────
  # Cette image est utilisée pour le développement local. 
  # Pour staging/production, utiliser une image fiable (ex: quay.io/minio/minio).
  wasel-minio:
    image: minio/minio:RELEASE.2025-02-28T09-55-16Z
    container_name: wasel-minio
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    command: server /data --console-address ":9001"
    volumes:
      - wasel-minio-data:/data:z
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:9000/minio/health/live" ]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - wasel-network
    restart: unless-stopped

  # ──────────────────────────────────────────────
  # Keycloak (IAM / Auth)
  # ──────────────────────────────────────────────
  wasel-keycloak:
    build:
      context: ./infra/keycloak
      dockerfile: Dockerfile
    container_name: wasel-keycloak
    command: start-dev --import-realm
    ports:
      - "8080:8080"
    environment:
      KC_DB: ${KC_DB}
      KC_DB_URL: ${KC_DB_URL}
      KC_DB_USERNAME: ${KC_DB_USERNAME}
      KC_DB_PASSWORD: ${KC_DB_PASSWORD}
      KEYCLOAK_ADMIN: ${KEYCLOAK_ADMIN}
      KEYCLOAK_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD}
    volumes:
      - wasel-keycloak-data:/opt/keycloak/data:z
      - ./infra/keycloak/my-theme:/opt/keycloak/themes/my-theme:ro,z
      - ./infra/keycloak/realm-import.json:/opt/keycloak/data/import/realm-import.json:ro,z
    healthcheck:
      test: [ "CMD-SHELL", "exec 3<>/dev/tcp/localhost/8080" ]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 30s
    networks:
      - wasel-network
    restart: unless-stopped

  # ──────────────────────────────────────────────
  # Adminer (Database UI)
  # ──────────────────────────────────────────────
  wasel-adminer:
    image: adminer:latest
    container_name: wasel-adminer
    ports:
      - "8081:8080"
    environment:
      ADMINER_DEFAULT_SERVER: wasel-postgres
    networks:
      - wasel-network
    restart: unless-stopped
  # ──────────────────────────────────────────────
  # Astro Frontend (Web)
  # ──────────────────────────────────────────────
  wasel-frontend:
    build:
      context: ./web
      dockerfile: Dockerfile
      target: builder # 1. Stop at the 'builder' stage
    container_name: wasel-frontend
    command: npm run dev -- --host 0.0.0.0 # 2. Force the Dev Server to run
    environment:
      - HOST=0.0.0.0
      - PORT=4321
      - PUBLIC_KEYCLOAK_URL=http://localhost:8000/auth
      - INTERNAL_API_URL=http://wasel-api:8080
      - PUBLIC_KEYCLOAK_REALM=wasel
      - PUBLIC_KEYCLOAK_CLIENT_ID=wasel-front
      - PUBLIC_APP_URL=http://localhost:8000
      - KEYCLOAK_INTERNAL_URL=http://wasel-keycloak:8080/auth
      - MINIO_URL=http://wasel-minio:9000
    volumes:
      - ./web:/app:z
      - /app/node_modules
    networks:
      - wasel-network
    restart: unless-stopped
  # ──────────────────────────────────────────────
  # Nginx (Reverse Proxy)
  # ──────────────────────────────────────────────
  wasel-nginx:
    image: nginx:alpine
    container_name: wasel-nginx
    ports:
      - "8000:80"
    volumes:
      - ./infra/nginx/nginx.conf:/etc/nginx/nginx.conf:ro,z
    depends_on:
      - wasel-api
      - wasel-keycloak
      - wasel-frontend
    networks:
      - wasel-network
    restart: unless-stopped
# ──────────────────────────────────────────────
# Volumes
# ──────────────────────────────────────────────
volumes:
  wasel-postgres-data:
  wasel-minio-data:
  wasel-keycloak-data:
  wasel-rabbitmq-data:

    # ──────────────────────────────────────────────
    # Network
    # ──────────────────────────────────────────────
networks:
  wasel-network:
    driver: bridge
