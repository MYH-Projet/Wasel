worker_processes auto;

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    sendfile on;
    keepalive_timeout 65;
    client_max_body_size 50M;

    map $http_upgrade $connection_upgrade {
        default upgrade;
        '' close;
    }

    # ──────────────────────────────────────────────
    # Upstreams
    # ──────────────────────────────────────────────
    upstream wasel_api {
        server wasel-api-staging:8080;
    }

    upstream wasel_keycloak {
        server wasel-keycloak-staging:8080;
    }

    upstream wasel_frontend {
        server wasel-frontend-staging:4321;
    }

    # ──────────────────────────────────────────────
    # HTTP → HTTPS redirection
    # ──────────────────────────────────────────────
    server {
        listen 80;
        server_name staging.lwasel.tech;

        # Certbot renewal challenge must remain accessible over HTTP
        location /.well-known/acme-challenge/ {
            root /var/www/certbot;
            try_files $uri =404;
        }

        location / {
            return 301 https://$host$request_uri;
        }
    }

    # ──────────────────────────────────────────────
    # HTTPS server
    # ──────────────────────────────────────────────
    server {
        listen 443 ssl;
        server_name staging.lwasel.tech;

        ssl_certificate /etc/letsencrypt/live/staging.lwasel.tech/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/staging.lwasel.tech/privkey.pem;

        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_prefer_server_ciphers off;

        # Security Headers
        add_header X-Frame-Options "SAMEORIGIN";
        add_header X-XSS-Protection "1; mode=block";
        add_header X-Content-Type-Options "nosniff";
        add_header Referrer-Policy "strict-origin-when-cross-origin";

        # ──────────────────────────────────────────
        # /api/* → Backend .NET API
        # ──────────────────────────────────────────
        location /api/ {
            proxy_pass http://wasel_api/api/;

            proxy_http_version 1.1;
            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
            proxy_set_header X-Forwarded-Host  $host;
            proxy_set_header X-Forwarded-Port  443;
        }

        # ──────────────────────────────────────────
        # /auth/* → Keycloak
        # ──────────────────────────────────────────
        location /auth/ {
            proxy_pass http://wasel_keycloak;

            proxy_http_version 1.1;
            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
            proxy_set_header X-Forwarded-Host  $host;
            proxy_set_header X-Forwarded-Port  443;

            proxy_buffer_size 128k;
            proxy_buffers 4 256k;
            proxy_busy_buffers_size 256k;
        }

        # ──────────────────────────────────────────
        # / → Frontend Astro
        # ──────────────────────────────────────────
        location / {
            proxy_pass http://wasel_frontend;

            proxy_http_version 1.1;
            proxy_set_header Upgrade           $http_upgrade;
            proxy_set_header Connection        $connection_upgrade;
            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
            proxy_set_header X-Forwarded-Host  $host;
            proxy_set_header X-Forwarded-Port  443;
        }
    }
}
