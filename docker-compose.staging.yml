services:
  # ──────────────────────────────────────────────
  # Backend API (.NET 10)
  # ──────────────────────────────────────────────
  wasel-api-staging:
    image: myelhadri/wasel-api:latest
    container_name: wasel-api-staging
    environment:
      - ASPNETCORE_ENVIRONMENT=${ASPNETCORE_ENVIRONMENT:-Staging}
      - ConnectionStrings__DefaultConnection=Host=wasel-postgres-staging;Port=5432;Database=${POSTGRES_DB};Username=${POSTGRES_USER};Password=${POSTGRES_PASSWORD}
      - Redis__ConnectionString=${REDIS_CONNECTION_STRING}
      - MinIO__Endpoint=wasel-minio-staging:9000
      - MinIO__AccessKey=${MINIO_ROOT_USER}
      - MinIO__SecretKey=${MINIO_ROOT_PASSWORD}
      - Keycloak__Authority=https://${STAGING_DOMAIN}/auth/realms/${KEYCLOAK_REALM}
      - Keycloak__InternalAuthority=http://wasel-keycloak-staging:8080/auth/realms/${KEYCLOAK_REALM}
      - Keycloak__NginxAuthority=https://${STAGING_DOMAIN}/auth/realms/${KEYCLOAK_REALM}
      - Keycloak__Realm=${KEYCLOAK_REALM}
      - Keycloak__ClientId=${KEYCLOAK_CLIENT_ID}
      - Keycloak__RequireHttpsMetadata=false
      - RabbitMQ__Host=wasel-rabbitmq-staging
      - RabbitMQ__Port=5672
      - RabbitMQ__Username=${RABBITMQ_DEFAULT_USER}
      - RabbitMQ__Password=${RABBITMQ_DEFAULT_PASS}
      - RabbitMQ__ExchangeName=wasel.events
      - RabbitMQ__NotificationRoutingKey=notification.requested
    depends_on:
      wasel-postgres-staging:
        condition: service_healthy
      wasel-redis-staging:
        condition: service_healthy
      wasel-keycloak-staging:
        condition: service_healthy
      wasel-rabbitmq-staging:
        condition: service_healthy
    networks:
      - wasel-staging-network
    restart: unless-stopped

  # ──────────────────────────────────────────────
  # Frontend Astro
  # ──────────────────────────────────────────────
  wasel-frontend-staging:
    image: myelhadri/wasel-frontend:latest
    container_name: wasel-frontend-staging
    environment:
      - VITE_API_URL=/api
      - VITE_KEYCLOAK_URL=/auth
      - PUBLIC_API_URL=/api
      - PUBLIC_KEYCLOAK_URL=/auth
      - PUBLIC_APP_URL=https://${STAGING_DOMAIN}
    networks:
      - wasel-staging-network
    restart: unless-stopped

  # ──────────────────────────────────────────────
  # PostgreSQL
  # ──────────────────────────────────────────────
  wasel-postgres-staging:
    image: postgres:15-alpine
    container_name: wasel-postgres-staging
    environment:
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=${POSTGRES_DB}
    volumes:
      - wasel-postgres-data-staging:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - wasel-staging-network
    restart: unless-stopped

  # ──────────────────────────────────────────────
  # Redis
  # ──────────────────────────────────────────────
  wasel-redis-staging:
    image: redis:8.6
    container_name: wasel-redis-staging
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - wasel-staging-network
    restart: unless-stopped

  # ──────────────────────────────────────────────
  # MinIO
  # ──────────────────────────────────────────────
  wasel-minio-staging:
    image: minio/minio:RELEASE.2025-02-28T09-55-16Z
    container_name: wasel-minio-staging
    environment:
      - MINIO_ROOT_USER=${MINIO_ROOT_USER}
      - MINIO_ROOT_PASSWORD=${MINIO_ROOT_PASSWORD}
    command: server /data --console-address ":9001"
    volumes:
      - wasel-minio-data-staging:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - wasel-staging-network
    restart: unless-stopped

  # ──────────────────────────────────────────────
  # Keycloak
  # ──────────────────────────────────────────────
  wasel-keycloak-staging:
    image: ${KEYCLOAK_IMAGE:-myelhadri/wasel-keycloak:latest}
    container_name: wasel-keycloak-staging
    command: start --import-realm
    environment:
      - KEYCLOAK_ADMIN=${KEYCLOAK_ADMIN}
      - KEYCLOAK_ADMIN_PASSWORD=${KEYCLOAK_ADMIN_PASSWORD}
      - KC_HEALTH_ENABLED=true
      - KC_HTTP_ENABLED=true
      - KC_HTTP_RELATIVE_PATH=/auth
      - KC_PROXY_HEADERS=xforwarded
      - KC_HOSTNAME=${STAGING_DOMAIN}
      - KC_HOSTNAME_STRICT=false
    volumes:
      - wasel-keycloak-data-staging:/opt/keycloak/data
      - ./infra/keycloak/realm-import.json:/opt/keycloak/data/import/realm-import.json:ro
    healthcheck:
      test: ["CMD-SHELL", "exec 3<>/dev/tcp/localhost/8080"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 30s
    networks:
      - wasel-staging-network
    restart: unless-stopped

  # ──────────────────────────────────────────────
  # Nginx Reverse Proxy
  # ──────────────────────────────────────────────
  wasel-nginx-staging:
    image: nginx:alpine
    container_name: wasel-nginx-staging
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./infra/nginx/staging.conf:/etc/nginx/nginx.conf:ro
      - letsencrypt-staging:/etc/letsencrypt
      - certbot-www-staging:/var/www/certbot
    depends_on:
      - wasel-api-staging
      - wasel-frontend-staging
      - wasel-keycloak-staging
    networks:
      - wasel-staging-network
    restart: unless-stopped

  # ──────────────────────────────────────────────
  # Certbot
  # ──────────────────────────────────────────────
  certbot:
    image: certbot/certbot
    container_name: wasel-certbot-staging
    volumes:
      - letsencrypt-staging:/etc/letsencrypt
      - certbot-www-staging:/var/www/certbot
    networks:
      - wasel-staging-network

  # ──────────────────────────────────────────────
  # RabbitMQ (Internal Event Bus)
  # ──────────────────────────────────────────────
  wasel-rabbitmq-staging:
    image: rabbitmq:3-management
    container_name: wasel-rabbitmq-staging
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_DEFAULT_USER}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_DEFAULT_PASS}
    volumes:
      - wasel-rabbitmq-data-staging:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - wasel-staging-network
    restart: unless-stopped

  # ──────────────────────────────────────────────
  # Wasel Notification Service (Microservice)
  # ──────────────────────────────────────────────
  wasel-notification-service-staging:
    image: ${NOTIFICATION_SERVICE_IMAGE:-myelhadri/wasel-notification-service:latest}
    container_name: wasel-notification-service-staging
    environment:
      - ConnectionStrings__DefaultConnection=Host=wasel-postgres-staging;Port=5432;Database=${POSTGRES_DB};Username=${POSTGRES_USER};Password=${POSTGRES_PASSWORD}
      - RabbitMQ__Host=wasel-rabbitmq-staging
      - RabbitMQ__Port=5672
      - RabbitMQ__Username=${RABBITMQ_DEFAULT_USER}
      - RabbitMQ__Password=${RABBITMQ_DEFAULT_PASS}
      - RabbitMQ__ExchangeName=wasel.events
      - RabbitMQ__QueueName=notification.requested
      - RabbitMQ__RoutingKey=notification.requested
      - Firebase__Enabled=false
      - Firebase__ProjectId=
      - Firebase__CredentialsPath=
    depends_on:
      wasel-postgres-staging:
        condition: service_healthy
      wasel-rabbitmq-staging:
        condition: service_healthy
    networks:
      - wasel-staging-network
    restart: unless-stopped

volumes:
  wasel-postgres-data-staging:
  wasel-minio-data-staging:
  wasel-keycloak-data-staging:
  wasel-rabbitmq-data-staging:
  letsencrypt-staging:
  certbot-www-staging:

networks:
  wasel-staging-network:
    driver: bridge