# ══════════════════════════════════════════════════
# Wasel — Docker Compose (Staging)
# ══════════════════════════════════════════════════

services:
  # ──────────────────────────────────────────────
  # Wasel API (.NET 10)
  # ──────────────────────────────────────────────
  wasel-api-staging:
    image: ${DOCKERHUB_USERNAME}/wasel-api:latest
    container_name: wasel-api-staging
    environment:
      - ASPNETCORE_ENVIRONMENT=${ASPNETCORE_ENVIRONMENT:-Staging}
      - ConnectionStrings__DefaultConnection=Host=wasel-postgres-staging;Port=5432;Database=${POSTGRES_DB};Username=${POSTGRES_USER};Password=${POSTGRES_PASSWORD}
      - Redis__ConnectionString=${REDIS_CONNECTION_STRING}
      - MinIO__Endpoint=wasel-minio-staging:9000
      - MinIO__AccessKey=${MINIO_ROOT_USER}
      - MinIO__SecretKey=${MINIO_ROOT_PASSWORD}
      - Keycloak__Authority=http://${STAGING_DOMAIN}/auth/realms/${KEYCLOAK_REALM}
      - Keycloak__InternalAuthority=http://wasel-keycloak-staging:8080/auth/realms/${KEYCLOAK_REALM}
      - Keycloak__NginxAuthority=http://${STAGING_DOMAIN}/auth/realms/${KEYCLOAK_REALM}
      - Keycloak__Realm=${KEYCLOAK_REALM}
      - Keycloak__ClientId=${KEYCLOAK_CLIENT_ID}
      - Keycloak__RequireHttpsMetadata=false
    depends_on:
      wasel-postgres-staging:
        condition: service_healthy
      wasel-redis-staging:
        condition: service_healthy
      wasel-keycloak-staging:
        condition: service_healthy
    networks:
      - wasel-staging-network
    restart: unless-stopped

  # ──────────────────────────────────────────────
  # PostgreSQL 18.3
  # ──────────────────────────────────────────────
  wasel-postgres-staging:
    image: postgres:18.3
    container_name: wasel-postgres-staging
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - wasel-postgres-data-staging:/var/lib/postgresql/data:z
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}" ]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - wasel-staging-network
    restart: unless-stopped

  # ──────────────────────────────────────────────
  # Redis 8.6
  # ──────────────────────────────────────────────
  wasel-redis-staging:
    image: redis:8.6
    container_name: wasel-redis-staging
    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - wasel-staging-network
    restart: unless-stopped

  # ──────────────────────────────────────────────
  # MinIO (Object Storage)
  # ──────────────────────────────────────────────
  wasel-minio-staging:
    image: minio/minio:RELEASE.2025-02-28T09-55-16Z
    container_name: wasel-minio-staging
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    command: server /data --console-address ":9001"
    volumes:
      - wasel-minio-data-staging:/data:z
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:9000/minio/health/live" ]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - wasel-staging-network
    restart: unless-stopped

  # ──────────────────────────────────────────────
  # Keycloak (IAM / Auth)
  # ──────────────────────────────────────────────
  wasel-keycloak-staging:
    image: quay.io/keycloak/keycloak:latest
    container_name: wasel-keycloak-staging
    command: start-dev --import-realm
    environment:
      KEYCLOAK_ADMIN: ${KEYCLOAK_ADMIN}
      KEYCLOAK_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD}
      KC_HEALTH_ENABLED: "true"
      KC_HTTP_RELATIVE_PATH: /auth
      KC_PROXY_HEADERS: xforwarded
      KC_HOSTNAME_URL: http://${STAGING_DOMAIN}/auth
      KC_HOSTNAME_ADMIN_URL: http://${STAGING_DOMAIN}/auth
    volumes:
      - wasel-keycloak-data-staging:/opt/keycloak/data:z
      - ./infra/keycloak/realm-export.json:/opt/keycloak/data/import/realm-export.json:ro,z
    healthcheck:
      test: [ "CMD-SHELL", "exec 3<>/dev/tcp/localhost/8080" ]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 30s
    networks:
      - wasel-staging-network
    restart: unless-stopped

  # ──────────────────────────────────────────────
  # Astro Frontend (Web)
  # ──────────────────────────────────────────────
  wasel-frontend-staging:
    image: ${DOCKERHUB_USERNAME}/wasel-frontend:latest
    container_name: wasel-frontend-staging
    environment:
      - VITE_API_URL=/api
    networks:
      - wasel-staging-network
    restart: unless-stopped

  # ──────────────────────────────────────────────
  # Nginx (Reverse Proxy)
  # ──────────────────────────────────────────────
  wasel-nginx-staging:
    image: nginx:alpine
    container_name: wasel-nginx-staging
    ports:
      - "80:80"
    volumes:
      - ./infra/nginx/staging.conf:/etc/nginx/nginx.conf:ro,z
    depends_on:
      - wasel-api-staging
      - wasel-keycloak-staging
      - wasel-frontend-staging
    networks:
      - wasel-staging-network
    restart: unless-stopped

# ──────────────────────────────────────────────
# Volumes
# ──────────────────────────────────────────────
volumes:
  wasel-postgres-data-staging:
  wasel-minio-data-staging:
  wasel-keycloak-data-staging:

# ──────────────────────────────────────────────
# Network
# ──────────────────────────────────────────────
networks:
  wasel-staging-network:
    driver: bridge
